<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Proyecto destacado: trading-bot</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161230"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#7b2ff7"/>
      <stop offset="100%" stop-color="#ff2fd6"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes blink { 0%,49%{opacity:1;} 50%,100%{opacity:0;} }
      @keyframes dash { to { stroke-dashoffset: -200; } }
      @keyframes pulse { 0%,100%{opacity:.5;} 50%{opacity:1;} }
      @keyframes floaty { 0%,100%{transform:translateY(0px);} 50%{transform:translateY(-6px);} }
      @keyframes grow { 0%{transform:scaleY(0.3);} 100%{transform:scaleY(1);} }
      .cursor{animation:blink 1s steps(1) infinite;}
      .flow{stroke-dasharray:12 8;animation:dash 3s linear infinite;}
      .node{animation:pulse 1.6s ease-in-out infinite;}
      .chip{animation:floaty 3.5s ease-in-out infinite;}
      .candle{transform-box:fill-box; transform-origin:bottom; animation:grow 2.4s ease-out infinite alternate;}
    </style>
  </defs>

  <rect width="900" height="220" fill="url(#bg)"/>

  <g stroke="url(#glow)" stroke-width="1.5" fill="none" opacity="0.5">
    <path class="flow" d="M480,110 H600"/>
  </g>

  <!-- Panel: trading-bot -->
  <g filter="url(#softGlow)">
    <rect x="50" y="30" width="410" height="160" rx="10" fill="#161b22" stroke="url(#glow)" stroke-width="1.5"/>
  </g>
  <circle cx="70" cy="48" r="5" fill="#ff5f56"/>
  <circle cx="88" cy="48" r="5" fill="#ffbd2e"/>
  <circle cx="106" cy="48" r="5" fill="#27c93f"/>
  <text x="70" y="80" font-family="monospace" font-size="16" fill="#c9d1d9">trading-bot</text>
  <text x="70" y="98" font-family="monospace" font-size="11" fill="#8b949e">risk-first · multi-agent · self-learning</text>

  <!-- mini gráfico de velas -->
  <g>
    <line x1="90" y1="82" x2="90" y2="66" stroke="#7ee787" stroke-width="2"/>
    <rect class="candle" x="86" y="66" width="8" height="16" fill="#7ee787" style="animation-delay:0s"/>
    <line x1="140" y1="72" x2="140" y2="52" stroke="#ff7b72" stroke-width="2"/>
    <rect class="candle" x="136" y="60" width="8" height="22" fill="#ff7b72" style="animation-delay:.2s"/>
    <line x1="190" y1="80" x2="190" y2="58" stroke="#7ee787" stroke-width="2"/>
    <rect class="candle" x="186" y="64" width="8" height="20" fill="#7ee787" style="animation-delay:.4s"/>
    <line x1="240" y1="86" x2="240" y2="60" stroke="#7ee787" stroke-width="2"/>
    <rect class="candle" x="236" y="66" width="8" height="24" fill="#7ee787" style="animation-delay:.6s"/>
    <line x1="290" y1="78" x2="290" y2="50" stroke="#ff7b72" stroke-width="2"/>
    <rect class="candle" x="286" y="56" width="8" height="26" fill="#ff7b72" style="animation-delay:.8s"/>
    <line x1="340" y1="90" x2="340" y2="48" stroke="#58a6ff" stroke-width="2"/>
    <rect class="candle" x="336" y="54" width="8" height="30" fill="#58a6ff" style="animation-delay:1s"/>
  </g>
  <line x1="70" y1="98" x2="450" y2="98" stroke="#30363d" stroke-width="1"/>

  <circle class="node" cx="70" cy="150" r="4" fill="#7ee787"/>
  <text x="82" y="154" font-family="monospace" font-size="12" fill="#7ee787">risk kernel: OK</text>
  <rect x="245" y="145" width="8" height="12" fill="#58a6ff" class="cursor"/>
  <text x="70" y="172" font-family="monospace" font-size="11" fill="#8b949e">learning → reweight → hibernate</text>

  <!-- chip IA -->
  <g class="chip" transform="translate(700,60)">
    <polygon points="40,0 75,20 75,60 40,80 5,60 5,20" fill="none" stroke="url(#glow)" stroke-width="2"/>
    <circle cx="40" cy="40" r="10" fill="url(#glow)"/>
    <line x1="40" y1="0" x2="40" y2="15" stroke="url(#glow)" stroke-width="1.5"/>
    <line x1="40" y1="65" x2="40" y2="80" stroke="url(#glow)" stroke-width="1.5"/>
    <line x1="5" y1="20" x2="18" y2="30" stroke="url(#glow)" stroke-width="1.5"/>
    <line x1="75" y1="20" x2="62" y2="30" stroke="url(#glow)" stroke-width="1.5"/>
  </g>
  <text x="700" y="160" font-family="sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">AI · Risk-First</text>
  <text x="700" y="178" font-family="sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Architecture</text>
</svg>
