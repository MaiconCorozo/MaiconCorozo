<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161230"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#7b2ff7"/>
      <stop offset="100%" stop-color="#ff2fd6"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes blink { 0%,49%{opacity:1;} 50%,100%{opacity:0;} }
      @keyframes dash { to { stroke-dashoffset: -200; } }
      @keyframes pulse { 0%,100%{opacity:.4;} 50%{opacity:1;} }
      @keyframes floaty { 0%,100%{transform:translateY(0px);} 50%{transform:translateY(-6px);} }
      .cursor{animation:blink 1s steps(1) infinite;}
      .flow{stroke-dasharray:12 8;animation:dash 3s linear infinite;}
      .node{animation:pulse 2.2s ease-in-out infinite;}
      .chip{animation:floaty 3.5s ease-in-out infinite;}
    </style>
  </defs>

  <rect width="900" height="220" fill="url(#bg)"/>

  <g stroke="url(#glow)" stroke-width="1.5" fill="none" opacity="0.5">
    <path class="flow" d="M0,40 H250 L280,70 H500"/>
    <path class="flow" d="M900,180 H650 L620,150 H400" style="animation-delay:1s"/>
  </g>

  <circle class="node" cx="280" cy="70" r="4" fill="#00d4ff"/>
  <circle class="node" cx="620" cy="150" r="4" fill="#ff2fd6" style="animation-delay:.6s"/>

  <g filter="url(#softGlow)">
    <rect x="60" y="35" width="500" height="150" rx="10" fill="#161b22" stroke="url(#glow)" stroke-width="1.5"/>
  </g>
  <circle cx="80" cy="52" r="5" fill="#ff5f56"/>
  <circle cx="98" cy="52" r="5" fill="#ffbd2e"/>
  <circle cx="116" cy="52" r="5" fill="#27c93f"/>

  <g font-family="monospace" font-size="13">
    <text x="80" y="85" fill="#7ee787">const <tspan fill="#c9d1d9">dev</tspan> = <tspan fill="#79c0ff">"Angel Corozo"</tspan>;</text>
    <text x="80" y="108" fill="#ff7b72">function <tspan fill="#d2a8ff">build</tspan><tspan fill="#c9d1d9">(future) {</tspan></text>
    <text x="100" y="131" fill="#c9d1d9">return future.<tspan fill="#79c0ff">code</tspan>();</text>
    <text x="80" y="154" fill="#c9d1d9">}</text>
    <rect x="90" y="162" width="8" height="14" fill="#58a6ff" class="cursor"/>
  </g>

  <g class="chip" transform="translate(700,60)">
    <polygon points="40,0 75,20 75,60 40,80 5,60 5,20" fill="none" stroke="url(#glow)" stroke-width="2"/>
    <circle cx="40" cy="40" r="10" fill="url(#glow)"/>
    <line x1="40" y1="0" x2="40" y2="15" stroke="url(#glow)" stroke-width="1.5"/>
    <line x1="40" y1="65" x2="40" y2="80" stroke="url(#glow)" stroke-width="1.5"/>
    <line x1="5" y1="20" x2="18" y2="30" stroke="url(#glow)" stroke-width="1.5"/>
    <line x1="75" y1="20" x2="62" y2="30" stroke="url(#glow)" stroke-width="1.5"/>
  </g>
  <text x="700" y="160" font-family="sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">AI · Automation</text>
</svg>
